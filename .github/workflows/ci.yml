name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: Pack
        id: pack
        shell: bash
        run: |
          pnpm pack
          package="$(find . -maxdepth 1 -type f -name 'dsh-offpeak-saver-*.tgz' -print -quit)"
          test -n "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Packaged integration + real tool invocation
        run: node scripts/integration-test.mjs "${{ steps.pack.outputs.path }}"

  dsh-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Pack
        id: pack
        shell: bash
        run: |
          pnpm pack
          package="$(find . -maxdepth 1 -type f -name 'dsh-offpeak-saver-*.tgz' -print -quit)"
          test -n "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Fresh DSH profile install + boot smoke
        shell: bash
        run: scripts/dsh-smoke.sh "${{ steps.pack.outputs.path }}"
